<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant Demo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at top left, #111827 0%, #020617 45%, #030712 100%);
        color: #f8fafc;
      }
      .app {
        display: flex;
        height: 100vh;
      }
      .sidebar {
        width: 280px;
        background: rgba(2, 6, 23, 0.95);
        border-right: 1px solid rgba(148, 163, 184, 0.18);
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sidebar h3 { margin: 4px 0 8px; font-size: 15px; color: #e2e8f0; }
      .new-chat-btn, .thread-btn, .send-btn {
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.2s ease;
      }
      .new-chat-btn {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        padding: 10px 12px;
        border-radius: 10px;
        font-weight: 600;
      }
      .new-chat-btn:hover, .thread-btn:hover, .send-btn:hover { transform: translateY(-1px); }
      .thread-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
      .thread-btn {
        text-align: left;
        background: rgba(15, 23, 42, 0.8);
        padding: 10px 12px;
        border-radius: 10px;
        color: #e2e8f0;
        border: 1px solid rgba(148, 163, 184, 0.12);
      }
      .thread-btn.active { background: rgba(37, 99, 235, 0.2); border-color: rgba(96, 165, 250, 0.4); }
      .thread-title { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
      .thread-preview { font-size: 12px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 12px;
      }
      .chat-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: rgba(15, 23, 42, 0.86);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
      }
      .header {
        padding: 18px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        background: rgba(2, 6, 23, 0.6);
      }
      .thread-btn {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;

        padding: 14px;
        border-radius: 12px;
        border: 1px solid #2b3555;
        background: #131b34;

        cursor: pointer;

        overflow: hidden;      /* Prevent horizontal scrollbar */
        box-sizing: border-box;
    }

    .thread-title {
        width: 100%;
        font-weight: 600;
        color: #fff;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .thread-preview {
        width: 100%;
        font-size: 13px;
        color: #9aa4c7;
        line-height: 1.4;

        /* Wrap long text */
        white-space: normal;
        overflow-wrap: break-word;
        word-break: break-word;

        overflow: hidden;

        display: -webkit-box;
        -webkit-line-clamp: 2;      /* Show only 2 lines */
        -webkit-box-orient: vertical;
    }
      .header h1 { margin: 0 0 6px; font-size: 20px; }
      .header .pill { font-size: 12px; color: #9fb0c8; }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: linear-gradient(180deg, rgba(2, 6, 23, 0.25), rgba(2, 6, 23, 0.5));
      }
      .message {
        max-width: 78%;
        padding: 12px 14px;
        border-radius: 16px;
        white-space: pre-wrap;
        line-height: 1.5;
        font-size: 14px;
      }
      .user {
        align-self: flex-end;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
      }
      .assistant {
        align-self: flex-start;
        background: rgba(30, 41, 59, 0.95);
        color: #e2e8f0;
        border: 1px solid rgba(148, 163, 184, 0.14);
      }
      .composer {
        display: flex;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
        background: rgba(2, 6, 23, 0.7);
      }
      .composer input {
        flex: 1;
        border: none;
        outline: none;
        padding: 13px 14px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.95);
        color: white;
      }
      .send-btn {
        padding: 0 16px;
        border-radius: 12px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        font-weight: 600;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header .header-pic img {
        border-radius: 50%;
        border: 2px solid rgba(148, 163, 184, 0.18);
      }
      .empty { color: #94a3b8; font-size: 14px; margin-top: 12px; }
      @media (max-width: 900px) {
        .app { flex-direction: column; }
        .sidebar { width: 100%; max-height: 260px; border-right: none; border-bottom: 1px solid rgba(148, 163, 184, 0.18); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <button class="new-chat-btn" id="new-chat">+ New chat</button>
        <h3>Recent chats</h3>
        <div class="thread-list" id="thread-list"></div>
      </aside>
      <main class="main">
        <div class="chat-card">
          <div class="header">
            <div class="header-content">
              <h1>ChatGPT-style Assistant</h1>
              <div class="pill">Python + FastAPI + streaming demo</div>
            </div>
            <div class="header-pic">
              <img src="https://subratahaldar.netlify.app/assets/my-pic-DfvOt0wq.webp" alt="" style="width: 70px; height: 70px;">
            </div>
          </div>
          <div class="messages" id="messages"></div>
          <form class="composer" id="chat-form">
            <input id="input" placeholder="Ask anything..." autocomplete="off" />
            <button class="send-btn" type="submit">Send</button>
          </form>
        </div>
      </main>
    </div>
    <script>
      const messagesEl = document.getElementById('messages');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('input');
      const threadListEl = document.getElementById('thread-list');
      const newChatBtn = document.getElementById('new-chat');

      let threads = [];
      let activeThreadId = null;

      function saveThreads() {
        localStorage.setItem('chat-threads', JSON.stringify(threads));
        localStorage.setItem('active-thread-id', activeThreadId || '');
      }

      function loadThreads() {
        const saved = localStorage.getItem('chat-threads');
        if (saved) {
          threads = JSON.parse(saved);
          activeThreadId = localStorage.getItem('active-thread-id') || threads[0]?.id || null;
        } else {
          threads = [];
          activeThreadId = null;
        }
      }

      function createThread(title, messages = []) {
        const id = crypto.randomUUID();
        const thread = { id, title, messages };
        threads.unshift(thread);
        activeThreadId = id;
        saveThreads();
        renderThreads();
        return thread;
      }

      function getActiveThread() {
        return threads.find((thread) => thread.id === activeThreadId) || null;
      }

      function renderThreads() {
        threadListEl.innerHTML = '';
        if (!threads.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerText = 'No chats yet. Start a new one.';
          threadListEl.appendChild(empty);
          return;
        }

        threads.forEach((thread) => {
          const button = document.createElement('button');
          button.className = `thread-btn ${thread.id === activeThreadId ? 'active' : ''}`;
          button.innerHTML = `<span class="thread-title">${thread.title}</span><span class="thread-preview">${thread.messages.at(-1)?.content || 'Start chatting'}</span>`;
          button.addEventListener('click', () => {
            activeThreadId = thread.id;
            saveThreads();
            renderThreads();
            renderMessages();
          });
          threadListEl.appendChild(button);
        });
      }

      function renderMessages() {
        const thread = getActiveThread();
        messagesEl.innerHTML = '';
        if (!thread || !thread.messages.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerText = 'Start a new conversation with the assistant.';
          messagesEl.appendChild(empty);
          return;
        }

        thread.messages.forEach((message) => {
          const div = document.createElement('div');
          div.className = `message ${message.role}`;
          div.innerText = message.content;
          messagesEl.appendChild(div);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function appendMessage(role, content) {
        let thread = getActiveThread();
        if (!thread) {
          thread = createThread('New chat', []);
        }
        thread.messages.push({ role, content });
        saveThreads();
        renderThreads();
        renderMessages();
        return thread;
      }

      async function sendMessage(text) {
        if (!text) return;
        let thread = getActiveThread();
        if (!thread) {
          thread = createThread(text.slice(0, 30) || 'New chat', []);
        } else if (!thread.messages.length) {
          thread.title = text.slice(0, 30) || 'New chat';
        }

        thread.messages.push({ role: 'user', content: text });
        saveThreads();
        renderThreads();
        renderMessages();

        const assistantBubble = document.createElement('div');
        assistantBubble.className = 'message assistant';
        assistantBubble.innerText = '';
        messagesEl.appendChild(assistantBubble);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const response = await fetch('/chat/stream', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                messages: thread.messages,
                thread_id: thread.id,
                thread_title: thread.title
            })
        });

        if (!response.ok) {
            assistantBubble.innerText = `Server Error (${response.status})`;
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let reply = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (const part of parts) {
            if (!part.startsWith('data:')) continue;
            const payload = part.replace('data: ', '').trim();
            if (payload === '{}') continue;
            const data = JSON.parse(payload);
            reply += data.delta;
            assistantBubble.innerText = reply;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        }

        thread.messages.push({ role: 'assistant', content: reply });
        saveThreads();
        renderThreads();
        renderMessages();
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        input.value = '';
        await sendMessage(text);
      });

      newChatBtn.addEventListener('click', () => {
        createThread('New chat', []);
        renderMessages();
      });

      loadThreads();
      if (!threads.length) {
        createThread('New chat', []);
      }
      renderThreads();
      renderMessages();
    </script>
  </body>
</html>
